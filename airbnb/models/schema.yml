
version: 2

models:
  - name: dim_listings_cleansed
    columns:
      - name: listing_id
        data_tests:
          - unique
          - not_null

      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Entire home/apt'
                  - 'Private room'
                  - 'Shared room'
                  - 'Hotel room'

  - name: dim_hosts_cleansed
    description: "Cleansed Airbnb host dimension"
    columns:
      - name: host_id
        description: "Unique identifier for each host"
        data_tests:
          - unique
          - not_null

      - name: host_name
        description: "Name of the host"
        data_tests:
          - not_null

      - name: is_superhost
        description: "Indicates whether the host is a superhost"
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']
